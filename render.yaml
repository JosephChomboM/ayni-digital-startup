# Render Blueprint: crea los 4 servicios de Ayni (API y web, para stage y producción).
# Render no despliega solo: el pipeline de GitHub llama a los deploy hooks.
# Los valores con `sync: false` se piden al crear el Blueprint (ver la guía de Gonzalo).

services:
  # ---------- STAGE ----------
  - type: web
    name: ayni-api-stage
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: ENVIRONMENT
        value: stage
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # URL del frontend stage permitida para llamadas desde el navegador.
      - key: CORS_ORIGINS
        value: https://ayni-web-stage.onrender.com
      # Stripe se configura solo en stage y solo con objetos/credenciales de prueba.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: BILLING_SUCCESS_URL
        value: https://ayni-web-stage.onrender.com/?billing=success
      - key: BILLING_CANCEL_URL
        value: https://ayni-web-stage.onrender.com/?billing=cancel

  - type: web
    name: ayni-web-stage
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://ayni-api-stage.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------- PRODUCCIÓN ----------
  - type: web
    name: ayni-api-prod
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Origen y URLs de retorno de producción. Los pagos live aún no están habilitados
      # por el backend; no configurar aquí claves de prueba ni live.
      - key: CORS_ORIGINS
        value: https://ayni-web-prod.onrender.com
      - key: BILLING_SUCCESS_URL
        value: https://ayni-web-prod.onrender.com/?billing=success
      - key: BILLING_CANCEL_URL
        value: https://ayni-web-prod.onrender.com/?billing=cancel

  - type: web
    name: ayni-web-prod
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://ayni-api-prod.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
