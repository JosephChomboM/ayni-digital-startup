# CD: cada merge a main pasa CI, despliega a stage y, tras la aprobación
# configurada en el ambiente "production", promueve el mismo commit a producción.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un deploy a la vez; los nuevos esperan en cola en vez de cancelar al anterior.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  stage:
    name: Stage
    needs: ci
    uses: ./.github/workflows/deploy.yml
    with:
      environment: stage
    secrets: inherit

  production:
    name: Producción
    needs: stage
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
