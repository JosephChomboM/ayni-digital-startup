# Pipeline de Ayni Digital
#
# En cada Pull Request a main:  build + tests + seguridad
# Al mergear a main:            lo mismo, luego deploy a stage y,
#                               cuando alguien lo aprueba, deploy a producción.

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------- BUILD + TESTS ----------

  backend:
    name: Backend (build y tests)
    runs-on: ubuntu-latest
    environment: localhost
    # Base de datos temporal para los tests de integración
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ayni
          POSTGRES_PASSWORD: ayni
          POSTGRES_DB: ayni_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U ayni" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ayni:ayni@localhost:5432/ayni_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests unitarios
        run: uv run pytest tests/unit
      - name: Migraciones
        run: uv run alembic upgrade head
      - name: Tests de integración
        run: uv run pytest tests/integration

  frontend:
    name: Frontend (build y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # ---------- SEGURIDAD ----------

  security-scans:
    name: Escaneos de dependencias y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Buscar contraseñas o claves subidas por error
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Librerías de Python con vulnerabilidades conocidas
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --format requirements-txt > requirements.txt
          uvx pip-audit -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Librerías de npm con vulnerabilidades conocidas
        working-directory: frontend
        run: npm audit --audit-level=high

  security-regressions:
    name: Regresiones de seguridad (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Probar secretos, credenciales, JWT y CORS
        run: >-
          uv run pytest
          tests/unit/test_security_settings.py
          tests/unit/test_security_passwords.py
          tests/unit/test_security_jwt.py
          tests/unit/test_secret_audit.py
          tests/unit/test_cors.py
          -q

  dependency-review:
    name: Revisar dependencias nuevas del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Bloquear dependencias nuevas con vulnerabilidades altas
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analizar código
        uses: github/codeql-action/analyze@v4

  security-iac:
    name: Seguridad de IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Analizar Dockerfile y Docker Compose
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: trivy-iac-report.json
      - name: Mostrar hallazgos IaC en el resumen del job
        if: always()
        run: |
          echo '### Trivy IaC (HIGH/CRITICAL)' >> "$GITHUB_STEP_SUMMARY"
          if [ -s trivy-iac-report.json ]; then
            jq -r '.Results[]? as $r | ($r.Misconfigurations // [])[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL") | "| \($r.Target) | \(.ID) | \(.Severity) | \(.Title) |"' trivy-iac-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No se generó informe.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar informe de IaC
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-iac-report
          path: trivy-iac-report.json
          if-no-files-found: ignore
          retention-days: 14

  security-container:
    name: Seguridad de imagen backend (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Construir imagen local para escaneo
        run: docker build --tag ayni-api:${{ github.sha }} ./backend
      - name: Buscar CVE altas y críticas en la imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ayni-api:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-container-report.json
      - name: Mostrar CVE en el resumen del job
        if: always()
        run: |
          echo '### Trivy imagen (HIGH/CRITICAL)' >> "$GITHUB_STEP_SUMMARY"
          if [ -s trivy-container-report.json ]; then
            jq -r '.Results[]? as $r | ($r.Vulnerabilities // [])[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL") | "| \($r.Target) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "sin corrección") | \(.VulnerabilityID) | \(.Severity) |"' trivy-container-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No se generó informe.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar informe de imagen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-report
          path: trivy-container-report.json
          if-no-files-found: ignore
          retention-days: 14

  # Este es el check requerido por el ruleset actual de main. Al agregar los
  # escaneos como dependencias, cualquier fallo de seguridad bloquea ese check.
  security:
    name: Seguridad
    if: always()
    needs:
      - security-scans
      - security-regressions
      - dependency-review
      - codeql
      - security-iac
      - security-container
    runs-on: ubuntu-latest
    steps:
      - name: Exigir que pasen todos los controles
        if: always()
        env:
          SECURITY_SCANS: ${{ needs.security-scans.result }}
          SECURITY_REGRESSIONS: ${{ needs.security-regressions.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          CODEQL: ${{ needs.codeql.result }}
          SECURITY_IAC: ${{ needs.security-iac.result }}
          SECURITY_CONTAINER: ${{ needs.security-container.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          failed=0
          for check in SECURITY_SCANS SECURITY_REGRESSIONS CODEQL SECURITY_IAC SECURITY_CONTAINER; do
            value="${!check}"
            echo "$check: $value"
            if [ "$value" != "success" ]; then
              echo "::error::$check no pasó; el merge queda bloqueado."
              failed=1
            fi
          done
          echo "DEPENDENCY_REVIEW: $DEPENDENCY_REVIEW"
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$DEPENDENCY_REVIEW" != "success" ]; then
            echo "::error::La revisión de dependencias no pasó; el merge queda bloqueado."
            failed=1
          elif [ "$EVENT_NAME" = "push" ] && [ "$DEPENDENCY_REVIEW" != "skipped" ] && [ "$DEPENDENCY_REVIEW" != "success" ]; then
            echo "::error::Estado inesperado en la revisión de dependencias."
            failed=1
          fi
          exit "$failed"

  # ---------- DEPLOY (solo al mergear a main) ----------
  # Render despliega el commit exacto (?ref=) que pasó los tests.
  # Cada ambiente de GitHub guarda sus dos deploy hooks como secretos.

  deploy-stage:
    name: Deploy a stage
    if: github.event_name == 'push'
    needs: [backend, frontend, security, security-regressions, codeql, security-iac, security-container]
    runs-on: ubuntu-latest
    environment: stage
    env:
      API_HOOK: ${{ secrets.RENDER_API_STAGE_HOOK }}
      WEB_HOOK: ${{ secrets.RENDER_WEB_STAGE_HOOK }}
    steps:
      - name: Deploy API
        run: curl -fsS -X POST "$API_HOOK&ref=$GITHUB_SHA"
      - name: Deploy web
        run: curl -fsS -X POST "$WEB_HOOK&ref=$GITHUB_SHA"

  deploy-production:
    name: Deploy a producción
    needs: deploy-stage
    runs-on: ubuntu-latest
    # Este ambiente pide aprobación manual en GitHub antes de correr
    environment: production
    env:
      API_HOOK: ${{ secrets.RENDER_API_PROD_HOOK }}
      WEB_HOOK: ${{ secrets.RENDER_WEB_PROD_HOOK }}
    steps:
      - name: Deploy API
        run: curl -fsS -X POST "$API_HOOK&ref=$GITHUB_SHA"
      - name: Deploy web
        run: curl -fsS -X POST "$WEB_HOOK&ref=$GITHUB_SHA"
