# CI: build + tests (unitarios e integración) + seguridad.
# Corre en cada PR hacia main y es reutilizado por cd.yml antes de desplegar.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    name: Backend · lint y arquitectura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Límites entre módulos
        run: uv run python ../scripts/check_module_boundaries.py

  backend-unit:
    name: Backend · tests unitarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest tests/unit --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  backend-integration:
    name: Backend · tests de integración
    runs-on: ubuntu-latest
    # Ambiente "localhost": réplica del docker-compose local dentro de CI.
    environment: localhost
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ayni
          POSTGRES_PASSWORD: ayni
          POSTGRES_DB: ayni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: localhost
      DATABASE_URL: postgresql+psycopg://ayni:ayni@localhost:5432/ayni_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Migraciones (subir, bajar y volver a subir)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest tests/integration -m integration

  frontend:
    name: Frontend · lint, tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  security:
    name: Seguridad · secretos, dependencias y reglas de dominio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secretos en el código (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Vulnerabilidades en dependencias Python (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Vulnerabilidades en dependencias npm
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Sin lenguaje clínico en la UI
        run: python3 scripts/check_clinical_language.py

  dependency-review:
    name: Seguridad · revisión de dependencias nuevas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  docker:
    name: Build · imagen ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: ayni-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Vulnerabilidades en la imagen (Grype)
        uses: anchore/scan-action@v7
        with:
          image: ayni-${{ matrix.service }}:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  # Único check que se marca como obligatorio en la protección de main.
  ci-ok:
    name: CI OK
    if: always()
    needs: [backend-lint, backend-unit, backend-integration, frontend, security, dependency-review, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los jobs pasaron
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "CI en verde"
