[project]
name = "ayni-backend"
version = "0.1.0"
description = "API de Ayni Digital"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "email-validator>=2.3.0",
    "es-core-news-sm",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "spacy>=3.8,<3.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# S = reglas de seguridad
select = ["E", "F", "I", "B", "UP", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a real PostgreSQL (DATABASE_URL)"]
