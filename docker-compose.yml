# Ambiente "localhost": Postgres local para desarrollo y tests de integración.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ayni
      POSTGRES_PASSWORD: ayni
      POSTGRES_DB: ayni
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayni"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
